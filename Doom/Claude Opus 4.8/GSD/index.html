<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>DOOM Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Two-canvas composite: #game is the internal-resolution 3D framebuffer
       (CSS-upscaled, pixelated); #hud is a transparent display-resolution
       overlay for later HUD/crosshair/text. -->
  <canvas id="game"></canvas>
  <canvas id="hud"></canvas>

  <!--
    ============================================================================
    THE PHASE 1 CONTRACTS (canonical note — every later phase stands on these)
    ============================================================================

    TWO-CANVAS COMPOSITE:
      #game — internal-resolution framebuffer, CSS-upscaled with pixelated
              scaling; the raycaster (Phase 3) writes here via one putImageData.
      #hud  — transparent, DISPLAY-resolution overlay with pointer-events:none;
              Phase 6 draws crisp HUD/crosshair/text here.
      Both fill the viewport and are stacked absolutely.

    CLASSIC-SCRIPT LOAD-ORDER CONTRACT (load-bearing — do not reorder):
      1. js/config.js       — defines CONFIG + packRGBA/mulberry32 globals
      2. js/framebuffer.js  — defines Framebuffer (needs CONFIG)
      3. js/textures.js     — defines Textures (needs CONFIG/packRGBA/mulberry32)
      4. js/sprites.js      — defines Sprites (needs CONFIG/packRGBA/mulberry32)
      5. js/preview.js      — defines Preview (needs Framebuffer + Textures +
                              Sprites); the load-time generated-art atlas
      6. js/level.js        — defines Level: the parsed grid world (wall-ID
                              cells, forced-solid border, wall-ID -> texture
                              table, marker tables, LANDMARKS, line of sight).
                              Reads Textures.map LAZILY inside its accessors, so
                              it carries no hard dependency of its own; it sits
                              here so the chain reads "assets first, world
                              second, entry point last".
      7. js/player.js       — defines Player: the vector camera pose
                              {x,y,dirX,dirY,planeX,planeY} (D-01), single-matrix
                              rotation, and per-axis radius collision that slides
                              along walls (needs CONFIG + Level).
      8. js/input.js        — defines Input: live keyboard + pointer-lock mouse as
                              INTENT ONLY (D-07/D-08). Handlers hold a set of
                              physical key codes and an accumulated mouse delta;
                              readIntent() samples them once per frame and drains
                              the mouse delta. Assigned to the Game.input seam by
                              main.js. Needs Player only indirectly.
      9. js/topdown.js      — defines TopDown: the TEMPORARY Phase 2 top-down
                              verification view (D-09). render() writes the parsed
                              grid, spawn markers, the player and its facing/FOV
                              rays into Framebuffer.buf32 and does NOT present.
                              Attached through the Game.view seam behind
                              TopDown.ENABLED; PHASE 3 REPLACES IT BY RE-POINTING
                              THAT ONE ASSIGNMENT at the raycaster. Needs Level +
                              Player + Framebuffer.
     10. js/raycaster.js    — defines Raycaster: the Phase 3 first-person software
                              raycaster (Pass A whole-frame fill + Pass B DDA wall
                              cast with PERPENDICULAR distance, the per-column
                              z-buffer write, and solid-shaded wall columns).
                              render() writes Framebuffer.buf32 + zBuffer and does
                              NOT present. Attached through the Game.view seam in
                              place of TopDown. Reads CONFIG/Framebuffer/Level/
                              Player; read by nothing before game.js.
     11. js/entities.js     — defines Entities: the spawn-derived billboard list
                              (built from Level.spawns) plus the sprite render
                              pass. Runs INSIDE Raycaster.render() via the
                              Raycaster.spritePass seam, AFTER the wall pass fills
                              zBuffer and BEFORE Game.render's single present().
                              Projects each entity as a camera-facing billboard
                              (inverted [dir|plane] matrix), depth-sorts far->near
                              allocation-free, and draws with a per-column z-buffer
                              occlusion cut + alpha-key transparency. Reads
                              Framebuffer/Player/Level/Sprites/Raycaster; read by
                              nothing before game.js.
     12. js/combat.js       — defines Combat: the PLAYER's combat state (health,
                              armor, ammo, weapon selection, the dead flag) and
                              damagePlayer(), which owns the LOCKED armor
                              absorption formula min(armor, floor(dmg/3)). Split
                              from js/player.js on purpose: player.js owns the
                              POSE the renderer depends on, this file owns the
                              STATS, so combat state never reaches the render
                              path. Reads CONFIG and Game.time; read by
                              enemies.js (projectile impact), game.js (the dead
                              flag) and Phase 6's HUD.
     13. js/enemies.js      — defines Enemies: the idle/chase/attack state
                              machine, the chase movement (through the SHARED
                              per-axis slide Player.slideMove, so an enemy
                              collides with walls with the player's exact
                              semantics), and the preallocated fireball pool.
                              build() ADOPTS the enemy billboards entities.js
                              already emitted — matched by their `kind` field —
                              and never appends a second object, so exactly one
                              billboard exists per spawn marker. Dispatched from
                              Game.step. Needs CONFIG + Level + Player +
                              Entities + Combat.
     14. js/weapons.js      — defines Weapons: the player's HITSCAN weapons. The
                              weapon table (read from CONFIG), the per-ray
                              nearest-ALIVE-enemy resolution with its own grid DDA
                              WALL STOP (so a shot cannot pass through a wall), the
                              ammo gate that refuses to fire — and refuses to charge
                              the cooldown — when empty, and the viewmodel state
                              (bob / recoil / muzzle flash) drawn through the
                              Raycaster.overlayPasses seam. Every landed ray calls
                              Enemies.hurt, the single enemy-damage entry point, so
                              it loads AFTER js/enemies.js. Dispatched from
                              Game.step. Needs CONFIG + Level + Player + Combat +
                              Enemies (+ Framebuffer/Sprites/Raycaster for the
                              viewmodel draw).
     15. js/sound.js        — defines Sound: the Sound.play(name) EVENT HOOK. It
                              records the event (a small preallocated ring of
                              recent names, a total count and the last name) and
                              returns; it creates NO AudioContext and touches no
                              DOM. Phase 5 fires the event so PICK-05 has a real
                              call site; PHASE 6 (AUD-01/02/03) replaces the body
                              with Web Audio synthesis and adds the remaining call
                              sites (firing, enemy death, player damage). Depends
                              on nothing — it sits here purely so js/pickups.js,
                              its only Phase 5 caller, loads after it.
     16. js/pickups.js      — defines Pickups: the typed world items. build()
                              ADOPTS the pickup billboards entities.js already
                              emitted — matched by their `kind` field, and
                              re-runnable because Entities.build() assigns a FRESH
                              list — and update() is the per-frame proximity scan
                              that collects an item the player walks over, applies
                              its effect through a Combat grant, deactivates it,
                              posts a Game.message and calls the Sound hook.
                              Dispatched from Game.step AFTER the weapon update, so
                              the test sees the pose the frame ended on. Needs
                              CONFIG + Player + Entities + Combat + Sound (+ Game
                              for the message queue, resolved at call time).
     17. js/hud.js          — defines HUD: the #hud OVERLAY renderer (Phase 6,
                              D-01). render() clears and repaints the transparent
                              DISPLAY-resolution overlay canvas every frame — it
                              must repaint every frame because Framebuffer.resize()
                              re-sizes (and therefore CLEARS) that backing store.
                              It draws through the Canvas 2D API and NEVER calls
                              putImageData/getImageData on either context, so the
                              single-blit-per-frame contract that Game.render owns
                              is untouched. In THIS plan it draws the title,
                              victory and death screens (06-02 adds the in-game
                              status bar, crosshair, minimap and damage flash —
                              in the playing state it currently draws nothing at
                              all). It adds NO message
                              renderer: Game.renderMessage stays the sole one
                              (D-02). Dispatched from Game.render AFTER
                              Framebuffer.present(); it needs Framebuffer, and
                              reads CONFIG/Game at CALL time, which is why it can
                              sit here BEFORE js/game.js.
     18. js/game.js         — defines Game: the requestAnimationFrame loop with
                              the CLAMPED delta-time (CONFIG.DT_MAX), the refocus
                              resync, and the two seams. Game.input (an intent
                              source) and Game.view (a buf32 writer that does NOT
                              present) are the seams Plan 03 fills and Phase 3
                              re-points at the raycaster. The delta-time clamp
                              lives in CONFIG.DT_MAX; the single Framebuffer
                              present() lives in Game.render() so the once-per-
                              frame blit contract survives every view swap.
                              PHASE 6 adds the four-state machine (Game.STATES /
                              state / setState / checkEndConditions / handleGesture
                              / restart / result): Game.frame gates the STEP on the
                              playing state while render + present stay
                              unconditional, and Game.render dispatches HUD.render
                              after the present. Game.step itself stays UN-GATED —
                              it is the raw simulation primitive every harness
                              drives directly.
     19. js/main.js         — entry point (needs CONFIG + Framebuffer + assets +
                              Level + Player + Input + TopDown + Raycaster +
                              Entities + Combat + Enemies + Weapons + Sound +
                              Pickups + Game): builds the level, spawns the player,
                              resets the player's combat and weapon state, builds
                              the enemies (Enemies.build() calls Entities.build()
                              itself, then adopts) and then Pickups.build() (which
                              adopts the pickup billboards from that SAME build),
                              wires Game.input = Input and Game.view = Raycaster
                              (with TopDown.ENABLED = false), Raycaster.spritePass
                              = Entities.render and then the viewmodel and the
                              message line onto Raycaster.overlayPasses IN THAT
                              ORDER, attaches resync triggers, starts the loop.
                              PHASE 6 also assigns Input.gestureHook =
                              Game.handleGesture (the LVL-06 single gesture) and
                              calls HUD.reset(), and deliberately LEAVES the boot
                              state at title so the first thing on screen is the
                              title screen over a frozen, fully rendered world.
      i.e. config -> framebuffer -> textures -> sprites -> preview -> level ->
      player -> input -> topdown -> raycaster -> entities -> combat -> enemies ->
      weapons -> sound -> pickups -> hud -> game -> main. Order encodes the
      dependency graph: later files extend earlier globals.

      NOT LOADED HERE: everything under tools/. Those are Node-only .cjs
      verification harnesses; the browser never sees them, which is why the
      self-containment gate is scoped to index.html, style.css and js/ only.

    ASSET-BUFFER CONTRACT (Plan 02 — consumed by Phases 3 and 4):
      Every texture/sprite is a flat
        { width, height, data: Uint8ClampedArray, buf32: Uint32Array }
      with buf32 aliasing data.buffer, so texels share the framebuffer's packed
      little-endian format and copy with a plain assignment. Wall/floor/ceiling
      textures are 64x64 (power of two — mask coords with `& 63`). Sprites carry
      per-pixel alpha and use a COLOR KEY: a texel is transparent when
      ((packed >>> 24) & 0xff) < 128. All art is generated in code from
      mulberry32(CONFIG.SEED + salt), so it is identical on every load.

    SELF-CONTAINMENT:
      Classic <script src> only — no ES modules (they break on file://), no
      bundler, no runtime network loads, no external CDNs/fonts/images. Every
      asset is co-located and referenced by a relative path so the game runs
      identically from file:// and a static server, fully offline.
  -->
  <script src="js/config.js"></script>
  <script src="js/framebuffer.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/level.js"></script>
  <script src="js/player.js"></script>
  <script src="js/input.js"></script>
  <script src="js/topdown.js"></script>
  <script src="js/raycaster.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/weapons.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/pickups.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
